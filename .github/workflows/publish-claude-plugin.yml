# Publishes the Claude plugin directory's copy of the plugin to the `claude-plugin` branch.
#
# The directory scans everything in the folder it is given, and it refuses scripts,
# AGENTS.md / CLAUDE.md and other repository tooling from organizations that are not
# Verified. main keeps that tooling (and `skills/` stays where `npx skills add`, the CLI
# doc sync and existing links expect it), so the directory tracks this generated branch
# instead: `teableio/agent-skills@claude-plugin`, holding only the files the plugin ships.
#
# Run it when a release should reach the Claude directory. Every new commit on the branch
# is picked up and scanned again, so it is manual rather than on every push to main.
# Never edit the branch by hand.
name: Publish Claude plugin branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-claude-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Export the plugin files to the branch
        run: |
          set -euo pipefail
          src="$(git rev-parse --short HEAD)"
          files=(skills assets .mcp.json .claude-plugin/plugin.json README.md LICENSE)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch_dir="$RUNNER_TEMP/claude-plugin"
          if git ls-remote --exit-code --heads origin claude-plugin >/dev/null; then
            git fetch --quiet origin claude-plugin
            git worktree add -B claude-plugin "$branch_dir" origin/claude-plugin
          else
            git worktree add --orphan -b claude-plugin "$branch_dir"
          fi

          cd "$branch_dir"
          git rm -rq --ignore-unmatch .
          git -C "$GITHUB_WORKSPACE" archive HEAD "${files[@]}" | tar -x -C "$branch_dir"
          git add -A
          if git diff --cached --quiet; then
            echo "claude-plugin already matches main@$src"
            exit 0
          fi
          git commit -q -m "Publish the Claude plugin from main@$src" \
            -m "Generated by .github/workflows/publish-claude-plugin.yml. Do not edit this branch by hand."
          git push origin claude-plugin
          echo "Published main@$src to claude-plugin"
