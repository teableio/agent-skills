# Throwaway workflow to exercise the sync-cli-docs "Notify webhook" step in the
# real Actions environment: secret wiring, runner egress, and receiver parsing.
# Sends the same payload shape with fake data — no CLI install, no pi run, no
# PR touched. Runs on push to its own branch and via workflow_dispatch.
# DELETE THIS FILE before merging the branch.

name: test-notify

on:
  workflow_dispatch:
  push:
    branches: [ci/sync-pr-webhook]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test payload
        env:
          GROUP_WEBHOOK_URL: ${{ secrets.GROUP_WEBHOOK_URL }}
          VERSION: 0.0.0-test
          OPERATION: created
          PR_NUMBER: '0'
          PR_URL: https://github.com/teableio/agent-skills/pull/0
          CHANGED: 'true'
          DRIFT: 'false'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Unlike the real step (which skips silently), fail loudly here so a
          # missing secret produces an unambiguous test result.
          if [ -z "$GROUP_WEBHOOK_URL" ]; then
            echo "::error::GROUP_WEBHOOK_URL secret is not configured — set it in repo secrets, then re-run"
            exit 1
          fi
          # Fake pi reviewer summary, as the sync workflow would have produced.
          printf '%s\n' \
            '## Summary (test data)' \
            '- Added `teable record import` command group' \
            '- Removed deprecated `--legacy` flag from `teable base export`' \
            > "$RUNNER_TEMP/pr-summary.md"
          # Keep this block identical to the Notify webhook step in
          # sync-cli-docs.yml so the test exercises the exact production script.
          SUMMARY_FILE="$RUNNER_TEMP/pr-summary.md"
          [ -s "$SUMMARY_FILE" ] || SUMMARY_FILE=/dev/null
          jq -n \
            --arg event "sync-cli-docs-pr" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg cli_version "$VERSION" \
            --arg operation "$OPERATION" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            --arg changed "$CHANGED" \
            --arg drift "$DRIFT" \
            --arg run_url "$RUN_URL" \
            --rawfile summary "$SUMMARY_FILE" \
            '{
              event: $event,
              repo: $repo,
              cli_version: $cli_version,
              pr: {
                number: ($pr_number | tonumber),
                url: $pr_url,
                operation: $operation
              },
              surface_changed: ($changed == "true"),
              docs_drift: ($drift == "true"),
              summary: ($summary | if . == "" then null else .[0:1500] end),
              run_url: $run_url
            }' > "$RUNNER_TEMP/webhook-payload.json"
          echo "Payload:"
          cat "$RUNNER_TEMP/webhook-payload.json"
          curl -sf -X POST "$GROUP_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/webhook-payload.json"
