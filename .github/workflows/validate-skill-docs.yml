# Validates that every `teable ...` invocation documented in the
# teable-assistant-ops skill exists in the committed CLI manifest snapshot.
# This is the mechanical guard against hallucinated commands/flags in the
# AI-generated sync PRs (and in human edits alike).

name: validate-skill-docs

on:
  pull_request:
    paths:
      - 'skills/teable-assistant-ops/**'
      - '.github/teable-cli-manifest.json'
      - 'scripts/validate-cli-docs.mjs'
  push:
    branches: [main]
    paths:
      - 'skills/teable-assistant-ops/**'
      - '.github/teable-cli-manifest.json'
      - 'scripts/validate-cli-docs.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CLI docs against manifest snapshot
        run: node scripts/validate-cli-docs.mjs

      # Advisory until the mirrors first converge — flip continue-on-error to
      # false once a sync PR with regenerated mirrors has merged.
      - name: Check api-reference mirrors against embedded CLI docs
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f .github/teable-cli-manifest.json ]; then
            echo "no manifest snapshot yet — skipping mirror check (bootstrap)"
            exit 0
          fi
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('.github/teable-cli-manifest.json','utf8')).version")"
          npm install -g "@teable/cli@${VERSION}"
          node scripts/dump-cli-docs.mjs --manifest .github/teable-cli-manifest.json --check
