# Builds the Claude directory edition of plugins/teable from main and pushes
# it to the claude-release branch, which the Claude plugin directory tracks.
#
# The edition is main minus what the directory's policy scan refuses
# (.github/claude-directory.json, applied by scripts/build-claude-directory.mjs).
# Everyone else installs from main.
#
# Every push to claude-release becomes a new version in the directory and
# replaces one that is in review or under appeal, so a merge to main publishes
# only when it changes the plugin version in .claude-plugin/plugin.json (raise
# it with .codex-plugin/plugin.json to release). Doc syncs and other merges
# leave claude-release alone. Run it by hand to publish without a version bump.

name: publish-claude-directory

on:
  push:
    branches: [main]
    paths:
      - 'plugins/teable/**'
      - '.github/claude-directory.json'
      - 'scripts/build-claude-directory.mjs'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch of main to build from
        required: true
        default: main
      force:
        description: Publish even if the plugin version is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-claude-directory
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Release only on a new plugin version
        id: gate
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          manifest=plugins/teable/.claude-plugin/plugin.json
          version="$(jq -r .version "$manifest")"
          published="none"
          if git fetch -q origin claude-release 2>/dev/null; then
            published="$(git show "FETCH_HEAD:$manifest" 2>/dev/null | jq -r .version || echo none)"
          fi
          echo "main: $version, claude-release: $published" >> "$GITHUB_STEP_SUMMARY"
          if [ "$version" != "$published" ] || [ "$FORCE" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Plugin version unchanged: claude-release left as is." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: 22
      - name: Build the directory edition
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/build-claude-directory.mjs
      - name: Keep environment reads out of the plugin
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/check-plugin-env-reads.mjs
      - name: Push to claude-release
        if: steps.gate.outputs.publish == 'true'
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugins/teable
          git commit -m "chore: Claude directory edition of ${source_sha::7}" \
            -m "Built from ${REF} (${source_sha}) with .github/claude-directory.json."
          git push --force origin HEAD:refs/heads/claude-release
          echo "claude-release now holds the directory edition of ${source_sha}" >> "$GITHUB_STEP_SUMMARY"
